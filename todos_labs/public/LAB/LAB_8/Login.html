<!DOCTYPE html>

<html>

    <head>
        <meta charset = "UTF-8">
        <title>Login</title>
        <link rel="stylesheet" href="login.css">
    </head>

    <body>
        <h1 class="mensagem">Bem vindo vamos realizar seu login:</h1>
        <form action="/logar" method="post">

            <div>
                <label for = 'email'>Email:</label>
                <input type = 'email' placeholder = 'Joãovitor@gmail.com' id='email' name = 'email' required>
            </div>


            <div>
                <label for = 'user'>Usuário:</label>
                <input type = 'text' placeholder = 'João Vitor' id='user' name = 'usuario' required>
            </div>

            <div>
                <label for = 'senha'>Senha:</label>
                <input type = 'password' placeholder = '1234' id='senha' name = 'senha' required>
            </div>

            <div class = "botoes">
                <div>
                    <input type = "reset">
                </div>

                <div>
                    <input type="submit">
                </div>
            </div>
            


        </form>




    </body>
</html>
