<!DOCTYPE html>

<html>

    <head>
        <title><Cadastrar_post class="html"></Cadastrar_post></title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="cadastro.css">
    </head>


    <body>
        <h1>Página de cadastro de novos posts no blog:</h1>
        
        <form action="/enviar" method = "post">
            <div>
                <label for="titulo">Titulo:</label>
                <input name="titulo" id="titulo" type="text" placeholder="Teste" required>
            </div>
            
            <div>
                <label for="resumo">Resumo</label>
                <input type="text" name="resumo" id="resumo" placeholder="esse é um post" required>
            </div>

            <div>
                <label for="conteudo">Conteúdo</label>
                <input type="text" name="conteudo" id="conteudo" placeholder="Esse é o meu primeiro post" required>
            </div>
            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>


    </body>
</html>
